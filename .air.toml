# Air (github.com/air-verse/air) — hot reload de desenvolvimento.
# Instale com: go install github.com/air-verse/air@latest
# Rode com: make dev
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/npcai"
  cmd = "go build -o ./tmp/npcai ./cmd/npcai"
  # Endereco estavel: o socket fica em caminho fixo (nao por PID), entao o
  # cliente so precisa reconectar no mesmo endereco apos cada rebuild.
  # Logs em console/debug para o fluxo de dev; stdout continua so com o
  # handshake JSON.
  args_bin = ["--socket", "tmp/npcai-dev.sock", "--config-dir", "configs", "--log-format", "console", "--log-level", "debug"]
  # configs/*.json dispara rebuild de proposito: os perfis sao carregados uma
  # unica vez no startup, entao editar um perfil so faz efeito com restart —
  # que e exatamente o que o air faz aqui.
  include_ext = ["go", "json"]
  # gen/ e gerado pelo buf (so muda via `make generate`); bin/ e dist/ sao
  # saidas de build; tmp/ e do proprio air.
  exclude_dir = ["bin", "dist", "tmp", "gen", ".git"]
  exclude_regex = ["_test.go"]
  delay = 500
  stop_on_error = true
  # O servidor trata SIGINT/SIGTERM com shutdown gracioso (marca NOT_SERVING,
  # GracefulStop e remove o socket), entao pedimos interrupcao em vez de
  # SIGKILL direto.
  send_interrupt = true
  kill_delay = "3s"

[misc]
  clean_on_exit = true

[log]
  time = true
