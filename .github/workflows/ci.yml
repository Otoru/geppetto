name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go toolchain version: go.mod.
          go-version-file: go.mod
      - uses: bufbuild/buf-setup-action@v1
      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          install-mode: binary
      - name: Verify generated bindings
        run: |
          make generate
          git diff --exit-code -- internal/gen
      - name: Buf lint and breaking checks
        run: |
          buf lint
          buf breaking --against ".git#branch=${{ github.event.repository.default_branch }}"
      - name: Test with race detector
        run: go test -race ./...
      - name: Report Go API compatibility
        # Public API changes are advisory while this module is v0. Remove
        # continue-on-error when v1 compatibility must be enforced.
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          current_tag="${GITHUB_REF_NAME:-}"
          baseline_tag="$(
            git tag --merged HEAD --list 'v*' --sort=-v:refname \
              | awk -v current_tag="${current_tag}" \
                '$0 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $0 != current_tag && !found { print; found = 1 }'
          )"

          if [ -z "${baseline_tag}" ]; then
            # The first release has no prior public API to compare against.
            echo "No previous release tag found; skipping Go API compatibility report."
            exit 0
          fi

          echo "Comparing the public module API with ${baseline_tag}."
          # gorelease compares the whole module and gives a semver-oriented report.
          go run golang.org/x/exp/cmd/gorelease@v0.0.0-20260908205506-85c1c2202aba -base="${baseline_tag}"
      - name: Lint
        run: golangci-lint run ./...
      - name: Build
        run: go build ./...
